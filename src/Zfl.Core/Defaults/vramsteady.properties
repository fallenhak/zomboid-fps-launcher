# VRAM Steady settings (read at game start)
# mode: orphan (default) | subdata | off
mode=orphan
# overlay: on (default) | off - small status line in the bottom-left corner (in game: Ctrl+Shift+V toggles)
overlay=on
# smallest buffer size class in KB (power of two)
minKb=64
# guard: on (default) | off - if the mod ever costs too much time per second it switches itself off for this session
guard=on
# guardMs: milliseconds per second spent in the mod's uploads that trip the guard (default 250)
guardMs=250
