# Blood FX for Viewpoint - Fixes settings. Same as Options > MODS > Blood FX for Viewpoint - Fixes.
# Edit while the game is closed (or before loading a save); the options page rewrites this file on Accept.
version = 5

# --- Blood placement
# Enabled
enabled = true
# Blood comes from the struck body part: Spray from the head, torso or limb that was hit instead of a point floating at chest height.
bodyLock = true
# Stomp blood stays on the ground: Blood from stomps and hits on zombies lying down comes from the body, not from the air above it.
groundFix = true

# --- Fences
# Blood flies over fences: Drops above a fence keep going instead of splatting in mid-air above it.
fenceFix = true
# Low fence height: Top of a low fence as a fraction of a floor. Lower it if blood still floats above fences.
lowFenceHeight = 0.4
# Tall fence height
tallFenceHeight = 0.8

# --- Troubleshooting
# Log hits to console.txt
debug = false
